<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to m4sh.ir — Mohammad Hossein Sadeghian</title>

<!-- 1. Tell search engines the real home of this content. -->
<link rel="canonical" href="https://m4sh.ir/">

<!-- 2. Meta refresh: fires even when JavaScript is disabled.
        Google treats a 0-second refresh like a permanent redirect. -->
<meta http-equiv="refresh" content="0; url=https://m4sh.ir/">

<meta name="robots" content="noindex, follow">
<meta name="description" content="Mohammad Hossein Sadeghian — Information Security Specialist. This page has moved to m4sh.ir">
<link rel="icon" href="https://m4sh.ir/assets/logo.jpg">

<!-- 3. JavaScript: runs first and, unlike the meta refresh, carries the
        path, query and hash across so deep links keep working. -->
<script>
(function () {
    var HOME = 'https://m4sh.ir';

    // The only paths that exist on m4sh.ir. Forwarding anything else would land
    // the visitor on the host's 404 page, so unknown paths go to the homepage.
    // Add an entry here whenever a new page goes live on m4sh.ir.
    var KNOWN = ['/', '/fa/', '/roadmap/'];

    // On a project page (m4sh-wacker.github.io/repo/) set this to the repo name
    // so /repo/roadmap/ maps to m4sh.ir/roadmap/. Leave '' for the user site.
    var REPO = '';

    var path = '/';

    if (location.protocol !== 'file:') {
        var p = location.pathname || '/';
        if (REPO && p.indexOf('/' + REPO) === 0) p = p.slice(REPO.length + 1) || '/';
        p = p.replace(/\/(?:index|404)\.html?$/i, '/');   // drop directory-index filenames
        if (p.charAt(p.length - 1) !== '/') p += '/';     // normalise to a trailing slash
        if (KNOWN.indexOf(p) !== -1) path = p;            // unknown -> stay '/'
    }

    // replace() so the redirect does not sit in the back-button history
    location.replace(HOME + path + location.search + location.hash);
})();
</script>

<style>
    :root { color-scheme: dark; }
    body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #050506; color: #fff;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center; padding: 24px;
    }
    .wrap { max-width: 420px; }
    .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #FF2E2E; box-shadow: 0 0 14px #FF2E2E;
        margin: 0 auto 22px; animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.8); } }
    h1 { font-size: 1.15rem; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em; }
    p  { font-size: .85rem; color: #9CA3AF; margin: 0 0 22px; line-height: 1.7; }
    a.btn {
        display: inline-block; padding: 11px 22px; border-radius: 12px;
        background: #FF2E2E; color: #fff; font-weight: 700; font-size: .85rem;
        text-decoration: none; transition: background .2s ease;
    }
    a.btn:hover { background: #B91C1C; }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
    <div class="wrap">
        <div class="dot"></div>
        <h1>Redirecting to m4sh.ir</h1>
        <p>Mohammad Hossein Sadeghian — Information Security Specialist, Bug Hunter &amp; Red Teamer.</p>
        <a class="btn" href="https://m4sh.ir/">Continue to m4sh.ir</a>
    </div>
</body>
</html>
